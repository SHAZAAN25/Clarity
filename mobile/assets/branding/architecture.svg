  <!-- Arrow B1: Gateway down to modules -->
  <path d="M 658 130 L 658 154" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Row 2: Security & Coach -->
  <g transform="translate(485, 158)">
    <rect width="168" height="66" rx="8" fill="url(#nodeBlue)" stroke="#0284C7" stroke-width="1.2"/>
    <text x="84" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">JWT &amp; Passlib</text>
    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7DD3FC" text-anchor="middle">Security &amp; Auth Tokens</text>
  </g>

  <g transform="translate(664, 158)">
    <rect width="168" height="66" rx="8" fill="url(#nodeBlue)" stroke="#0284C7" stroke-width="1.2"/>
    <text x="84" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">AI Coach Adapter</text>
    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#7DD3FC" text-anchor="middle">Empathetic CBT Feedback</text>
  </g>

  <!-- Connectors to Row 3 -->
  <path d="M 569 224 L 569 250" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M 748 224 L 748 250" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Row 3: RAG Health Library & Database -->
  <g transform="translate(485, 254)">
    <rect width="168" height="72" rx="8" fill="url(#nodeBlue)" stroke="#0284C7" stroke-width="1.2"/>
    <text x="84" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">RAG Health Library</text>
    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Curated WHO / CDC / NHS</text>
    <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Cosine Vector Retrieval</text>
  </g>

  <g transform="translate(664, 254)">
    <rect width="168" height="72" rx="8" fill="url(#nodeBlue)" stroke="#0284C7" stroke-width="1.2"/>
    <text x="84" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#E0F2FE" text-anchor="middle">SQL Relational DB</text>
    <text x="84" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">PostgreSQL / SQLite</text>
    <text x="84" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Indexed User &amp; Event Logs</text>
  </g>

  <!-- Connectors to Services Layer -->
  <path d="M 658 326 L 658 350" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Backend Services Layer -->
  <g transform="translate(485, 354)">
    <rect width="347" height="66" rx="8" fill="#0C2237" stroke="#0284C7" stroke-width="1"/>
    <text x="173" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#BAE6FD" text-anchor="middle">Modular Behavioral Micro-Services</text>
    <text x="173" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">SafetyService • CoachService • AIService • AnalyticsService</text>
    <text x="173" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94A3B8" text-anchor="middle">Clinical Boundary Guards • Emergency Triage Trigger</text>
  </g>


  <!-- ==================== CENTRAL SYNC BRIDGE ==================== -->
  <!-- Horizontal connector line connecting AppState and FastAPI -->
  <path d="M 395 184 L 485 106" stroke="#52B788" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrowSync)"/>

  <g transform="translate(378, 126)">
    <rect width="124" height="34" rx="6" fill="#064E3B" stroke="#52B788" stroke-width="1.2"/>
    <text x="62" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#6EE7B7" text-anchor="middle">OFFLINE-RESILIENT</text>
    <text x="62" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#A7F3D0" text-anchor="middle">Encrypted Sync ⇄</text>
  </g>

  <!-- Static Status Indicator Footer -->
  <g transform="translate(24, 466)">
    <text x="416" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">Deterministic Client-Server Behavioral Architecture • Fully Decoupled &amp; Privacy-First</text>
  </g>
</svg>
