<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #E5E7EB; letter-spacing: 0.3px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #9CA3AF; }
      .badge-text { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 10px; font-weight: 500; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #F3F4F6; }
      .node-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif; font-weight: 400; font-size: 10px; fill: #9CA3AF; }
      .flow-label { font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace; font-size: 9.5px; fill: #6EE7B7; }
    </style>
    
    <marker id="arrow-emerald" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#14B8A6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="920" height="460" rx="10" fill="#0A0E17" stroke="#1E293B" stroke-width="1"/>

  <!-- ==================== LEFT PANEL: MOBILE APPLICATION ==================== -->
  <g transform="translate(24, 24)">
    <!-- Container Card -->
    <rect width="416" height="412" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="416" height="40" rx="8" fill="#131D31"/>
    <rect y="32" width="416" height="8" fill="#131D31"/>
    <line x1="0" y1="40" x2="416" y2="40" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="20" cy="20" r="4" fill="#10B981"/>
    <text x="32" y="24" class="title">MOBILE APP</text>
    <text x="114" y="24" class="subtitle">Flutter 3.x / Android Native</text>
    <rect x="330" y="10" width="72" height="20" rx="4" fill="#064E3B" stroke="#047857" stroke-width="0.8"/>
    <text x="366" y="23" class="badge-text" fill="#6EE7B7" text-anchor="middle">OFFLINE-1ST</text>

    <!-- Layer 1: Presentation & Touch Layer -->
    <g transform="translate(16, 56)">
      <rect width="384" height="64" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="22" class="node-title">Touch Interface &amp; Micro-Interactions</text>
      <text x="14" y="38" class="node-desc">• 2-Second Fast Log with Situational Tags</text>
      <text x="14" y="52" class="node-desc">• 4-7-8 Breathing Orb Visualizer &amp; Tactile Haptic Feedback</text>
      <rect x="300" y="12" width="70" height="18" rx="3" fill="#0F172A"/>
      <text x="335" y="24" class="badge-text" fill="#94A3B8" text-anchor="middle">UI LAYER</text>
    </g>

    <!-- Arrow down to State -->
    <path d="M 208 120 L 208 138" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

    <!-- Layer 2: Reactive State Hub -->
    <g transform="translate(16, 142)">
      <rect width="384" height="52" rx="6" fill="#132E27" stroke="#059669" stroke-width="1"/>
      <text x="14" y="22" class="node-title" fill="#34D399">AppState Provider</text>
      <text x="14" y="38" class="node-desc">Central Reactive Store • Diurnal 24h Clock State • Event Dispatcher</text>
      <rect x="294" y="12" width="76" height="18" rx="3" fill="#064E3B"/>
      <text x="332" y="24" class="badge-text" fill="#A7F3D0" text-anchor="middle">STATE BUS</text>
    </g>

    <!-- Split Arrows to Engines -->
    <path d="M 112 194 L 112 216" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
    <path d="M 304 194 L 304 216" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

    <!-- Layer 3: Engines (Side by Side) -->
    <!-- Engine A: Target Engine -->
    <g transform="translate(16, 220)">
      <rect width="186" height="96" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" class="node-title">Target Engine</text>
      <text x="12" y="38" class="node-desc">7-Day evaluation cycles</text>
      <text x="12" y="54" class="node-desc">10% decrement algorithm</text>
      <text x="12" y="70" class="node-desc">Stabilization pause mode</text>
      <text x="12" y="86" class="node-desc">Floor = 1 cig / day</text>
    </g>

    <!-- Engine B: Delay Engine -->
    <g transform="translate(214, 220)">
      <rect width="186" height="96" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" class="node-title">Craving Intervention</text>
      <text x="12" y="38" class="node-desc">Adaptive resistance timer</text>
      <text x="12" y="54" class="node-desc">4-7-8 Breathing guidance</text>
      <text x="12" y="70" class="node-desc">Action cues: Walk / Water</text>
      <text x="12" y="86" class="node-desc">Non-punitive reflection</text>
    </g>

    <!-- Arrow down to Local Storage -->
    <path d="M 208 316 L 208 334" stroke="#10B981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>

    <!-- Layer 4: Local Database -->
    <g transform="translate(16, 338)">
      <rect width="384" height="54" rx="6" fill="#111C2E" stroke="#1E3A5F" stroke-width="0.8"/>
      <text x="14" y="22" class="node-title">On-Device Encrypted Storage (SQLite)</text>
      <text x="14" y="38" class="node-desc">All logs, cues, and timestamps stored locally. Zero tracking or telemetry data sold.</text>
      <rect x="290" y="12" width="80" height="18" rx="3" fill="#0C2540"/>
      <text x="330" y="24" class="badge-text" fill="#60A5FA" text-anchor="middle">LOCAL-ONLY</text>
    </g>
  </g>


  <!-- ==================== CENTRAL CONNECTOR BRIDGE ==================== -->
  <g transform="translate(440, 160)">
    <!-- Sync Pipe Lines -->
    <line x1="0" y1="52" x2="40" y2="52" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 3"/>
    
    <rect x="-8" y="24" width="56" height="56" rx="28" fill="#13231E" stroke="#059669" stroke-width="1"/>
    <text x="20" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle" fill="#34D399">⇄</text>
    <text x="20" y="62" class="badge-text" fill="#6EE7B7" text-anchor="middle">SYNC</text>

    <text x="20" y="98" class="flow-label" text-anchor="middle">TLS / HTTPS</text>
    <text x="20" y="112" class="badge-text" fill="#94A3B8" text-anchor="middle">JWT Header</text>
  </g>


  <!-- ==================== RIGHT PANEL: BACKEND SERVICES ==================== -->
  <g transform="translate(480, 24)">
    <!-- Container Card -->
    <rect width="416" height="412" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Header -->
    <rect width="416" height="40" rx="8" fill="#152136"/>
    <rect y="32" width="416" height="8" fill="#152136"/>
    <line x1="0" y1="40" x2="416" y2="40" stroke="#1E293B" stroke-width="1"/>
    
    <circle cx="20" cy="20" r="4" fill="#38BDF8"/>
    <text x="32" y="24" class="title">BACKEND SERVICE</text>
    <text x="142" y="24" class="subtitle">FastAPI / Python 3.14</text>
    <rect x="328" y="10" width="74" height="20" rx="4" fill="#0C344E" stroke="#0284C7" stroke-width="0.8"/>
    <text x="365" y="23" class="badge-text" fill="#38BDF8" text-anchor="middle">REST / JSON</text>

    <!-- Layer 1: API Router Gateway -->
    <g transform="translate(16, 56)">
      <rect width="384" height="64" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="14" y="22" class="node-title">FastAPI Application Gateway</text>
      <text x="14" y="38" class="node-desc">• OAuth2 / JWT Authentication &amp; Password Hashing (Passlib)</text>
      <text x="14" y="52" class="node-desc">• Rate-limited Async Endpoints (/api/v1/tracking, /coach, /analytics)</text>
      <rect x="300" y="12" width="70" height="18" rx="3" fill="#0F172A"/>
      <text x="335" y="24" class="badge-text" fill="#94A3B8" text-anchor="middle">ROUTER</text>
    </g>

    <!-- Arrow down to Domain Services -->
    <path d="M 208 120 L 208 138" stroke="#38BDF8" stroke-width="1.2" marker-end="url(#arrow-slate)"/>

    <!-- Layer 2: Behavioral Coaching & RAG Services -->
    <g transform="translate(16, 142)">
      <rect width="186" height="174" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="22" class="node-title">Behavioral AI Coach</text>
      <text x="12" y="38" class="node-desc">Empathetic CBT feedback</text>
      <text x="12" y="52" class="node-desc">Identifies situational triggers</text>
      <text x="12" y="66" class="node-desc">(Stress, Alcohol, Routine)</text>
      <line x1="12" y1="80" x2="174" y2="80" stroke="#334155" stroke-width="0.6"/>
      <text x="12" y="98" class="node-title">Safety Triage</text>
      <text x="12" y="114" class="node-desc">Clinical boundary guards</text>
      <text x="12" y="128" class="node-desc">Emergency referral rules</text>
      <text x="12" y="142" class="node-desc">Zero medical prescription</text>
      <rect x="12" y="150" width="80" height="16" rx="2" fill="#13271F"/>
      <text x="52" y="162" class="badge-text" fill="#34D399" text-anchor="middle">CBT SYSTEM</text>
    </g>

    <g transform="translate(214, 142)">
      <rect width="186" height="174" rx="6" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="22" class="node-title">Evidence-Based RAG</text>
      <text x="12" y="38" class="node-desc">Curated public health</text>
      <text x="12" y="52" class="node-desc">guidelines (WHO, CDC, NHS)</text>
      <text x="12" y="66" class="node-desc">Cosine vector similarity</text>
      <line x1="12" y1="80" x2="174" y2="80" stroke="#334155" stroke-width="0.6"/>
      <text x="12" y="98" class="node-title">Analytics Engine</text>
      <text x="12" y="114" class="node-desc">Hourly smoking frequency</text>
      <text x="12" y="128" class="node-desc">Expenditure in ₹ INR</text>
      <text x="12" y="142" class="node-desc">Craving resistance rate</text>
      <rect x="12" y="150" width="70" height="16" rx="2" fill="#0C2540"/>
      <text x="47" y="162" class="badge-text" fill="#38BDF8" text-anchor="middle">RAG SEARCH</text>
    </g>

    <!-- Arrow down to Database -->
    <path d="M 208 316 L 208 334" stroke="#38BDF8" stroke-width="1.2" marker-end="url(#arrow-slate)"/>

    <!-- Layer 3: Relational Persistence -->
    <g transform="translate(16, 338)">
      <rect width="384" height="54" rx="6" fill="#111C2E" stroke="#1E3A5F" stroke-width="0.8"/>
      <text x="14" y="22" class="node-title">PostgreSQL / SQLite Database</text>
      <text x="14" y="38" class="node-desc">SQLAlchemy ORM models: UserProfile, CigaretteLog, CravingEvent, TargetHistory.</text>
      <rect x="290" y="12" width="80" height="18" rx="3" fill="#0C2540"/>
      <text x="330" y="24" class="badge-text" fill="#60A5FA" text-anchor="middle">SQL ENGINE</text>
    </g>
  </g>
</svg>
