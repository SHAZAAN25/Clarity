  <rect x="461" y="24" width="395" height="452" rx="14" fill="url(#backendCardGrad)" stroke="#0369A1" stroke-width="1.5"/>
  <rect x="461" y="24" width="395" height="42" rx="14" fill="#0C253E" stroke="#0369A1" stroke-width="1"/>
  <rect x="461" y="52" width="395" height="14" fill="#0C253E"/>
  <!-- Subgraph Header -->
  <circle cx="483" cy="45" r="7" fill="#38BDF8"/>
  <text x="499" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#E2E8F0" letter-spacing="0.3">BACKEND SERVICE</text>
  <text x="645" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#38BDF8">[FastAPI &amp; Python 3.14]</text>

