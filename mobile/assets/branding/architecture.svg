  <g transform="translate(485, 82)">
    <rect width="347" height="48" rx="8" fill="#0C2A47" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="173" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">FastAPI Asynchronous Gateway</text>
