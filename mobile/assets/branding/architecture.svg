  <g transform="translate(48, 382)">
    <rect width="347" height="38" rx="8" fill="#132B22" stroke="#2D6A4F" stroke-width="1"/>
    <text x="173" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#A7F3D0" text-anchor="middle">Offline-First Operational Guarantee (100% On-Device)</text>
